{
  "version": 1,
  "kind": "action_pack",
  "name": "slack",
  "display_name": "Slack channel notifications",
  "description": "Slack channel notifications. Notification writes follow the flow approval policy; AI and API/agent-key runs require approval. Uncertain mutations are never automatically resent.",
  "vendor": "Slack",
  "categories": [
    "notifications"
  ],
  "source": {
    "kind": "nano_authored"
  },
  "config": [],
  "allow": [
    {
      "host": "slack.com",
      "path_prefixes": [
        "/api/chat.postMessage"
      ]
    }
  ],
  "auth": {
    "type": "bearer",
    "credential": "BOT_TOKEN"
  },
  "credentials": [
    {
      "name": "BOT_TOKEN",
      "label": "Bot token with chat:write"
    }
  ],
  "defaults": {
    "per_minute": 10,
    "per_day": 500,
    "timeout_secs": 20
  },
  "actions": {
    "post_message": {
      "display_name": "Post a plain-text channel message",
      "description": "Post plain text with markup and link/media unfurling disabled. Requires bot channel membership and chat:write, HTTP 200, ok=true and a message timestamp. API reference: https://docs.slack.dev/reference/methods/chat.postMessage/",
      "effect": "write",
      "idempotent": false,
      "inputs": [
        {
          "name": "channel_id",
          "type": "string",
          "required": true,
          "pattern": "^[CG][A-Z0-9]{8,20}$"
        },
        {
          "name": "text",
          "type": "string",
          "required": true,
          "pattern": "^[\\s\\S]{1,4000}$"
        }
      ],
      "steps": [
        {
          "id": "request",
          "request": {
            "method": "POST",
            "url": "https://slack.com/api/chat.postMessage",
            "json": {
              "channel": "{{input.channel_id}}",
              "text": "{{input.text}}",
              "mrkdwn": false,
              "parse": "none",
              "unfurl_links": false,
              "unfurl_media": false
            }
          },
          "expect": {
            "status": [
              200
            ],
            "path": "ts",
            "non_empty": true,
            "fields": {
              "ok": true
            }
          }
        }
      ],
      "outputs": {
        "channel": "steps.request.channel",
        "message_ts": "steps.request.ts"
      },
      "fixtures": [
        "fixtures/post_message.json"
      ],
      "rollback_unavailable": true,
      "rollback_unavailable_reason": "A delivered notification, page or external workflow cannot be recalled. No automatic inverse is supplied."
    },
    "notify_event": {
      "display_name": "Notify with a canonical alert or case",
      "description": "Render the canonical nano alert/case event with the shared core vendor formatter. Existing freeform actions are unchanged. Requires backend support for notification_body (NAN-4478).",
      "effect": "write",
      "idempotent": false,
      "inputs": [
        {
          "name": "channel_id",
          "type": "string",
          "required": true,
          "pattern": "^[CG][A-Z0-9]{8,20}$"
        },
        {
          "name": "notification",
          "type": "notification",
          "required": true
        }
      ],
      "steps": [
        {
          "id": "request",
          "request": {
            "method": "POST",
            "url": "https://slack.com/api/chat.postMessage",
            "json_text": "{{notification_body \"slack\" input.notification input.channel_id}}"
          },
          "expect": {
            "status": [
              200
            ],
            "path": "ts",
            "non_empty": true,
            "fields": {
              "ok": true
            }
          }
        }
      ],
      "outputs": {
        "channel": "steps.request.channel",
        "message_ts": "steps.request.ts"
      },
      "fixtures": [
        "fixtures/notify_event.json"
      ],
      "rollback_unavailable": true,
      "rollback_unavailable_reason": "A delivered notification, page or external workflow cannot be recalled. No automatic inverse is supplied."
    }
  }
}
