{
  "version": 1,
  "kind": "action_pack",
  "name": "opsgenie",
  "display_name": "Opsgenie",
  "description": "Opsgenie investigation and service actions.",
  "vendor": "Atlassian",
  "categories": [
    "alerting"
  ],
  "source": {
    "kind": "nano_authored"
  },
  "config": [
    {
      "name": "base_url",
      "label": "Opsgenie API region",
      "required": true,
      "default": "https://api.opsgenie.com",
      "one_of": [
        "https://api.opsgenie.com",
        "https://api.eu.opsgenie.com"
      ]
    }
  ],
  "allow": [
    {
      "host": "{{config.base_url}}",
      "path_prefixes": [
        "/v2/alerts"
      ]
    }
  ],
  "auth": {
    "type": "api_key_header",
    "header": "Authorization",
    "prefix": "GenieKey ",
    "credential": "API_KEY"
  },
  "credentials": [
    {
      "name": "API_KEY",
      "label": "Api Key"
    }
  ],
  "defaults": {
    "per_minute": 5,
    "per_day": 500,
    "timeout_secs": 20
  },
  "actions": {
    "get_alert": {
      "display_name": "Get alert",
      "description": "Read the alert by immutable ID, including closed alerts. API documentation: https://docs.opsgenie.com/docs/alert-api",
      "effect": "read",
      "idempotent": true,
      "inputs": [
        {
          "name": "alert_id",
          "type": "string",
          "required": true,
          "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
        }
      ],
      "steps": [
        {
          "id": "request",
          "request": {
            "method": "GET",
            "url": "{{config.base_url}}/v2/alerts/{{input.alert_id}}",
            "query": {
              "identifierType": "id"
            }
          },
          "expect": {
            "status": [
              200
            ],
            "path": "data.id",
            "json_type": "string",
            "non_empty": true
          }
        }
      ],
      "outputs": {
        "alert": "steps.request.data"
      },
      "output_types": {
        "alert": "object"
      },
      "fixtures": [
        "fixtures/get_alert.json"
      ]
    },
    "get_request_status": {
      "display_name": "Get asynchronous request status",
      "description": "Return success/failure processing metadata as data without reinterpreting failed or pending requests as completed alerts. API documentation: https://docs.opsgenie.com/docs/alert-api",
      "effect": "read",
      "idempotent": true,
      "inputs": [
        {
          "name": "request_id",
          "type": "string",
          "required": true,
          "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
        }
      ],
      "steps": [
        {
          "id": "request",
          "request": {
            "method": "GET",
            "url": "{{config.base_url}}/v2/alerts/requests/{{input.request_id}}"
          },
          "expect": {
            "status": [
              200
            ],
            "path": "data",
            "json_type": "object",
            "non_empty": true
          }
        }
      ],
      "outputs": {
        "request": "steps.request.data"
      },
      "output_types": {
        "request": "object"
      },
      "fixtures": [
        "fixtures/get_request_status.json"
      ]
    },
    "create_alert": {
      "display_name": "Create alert",
      "description": "Submit an alert to the configured integration; the request ID acknowledges dispatch and may trigger paging. API documentation: https://docs.opsgenie.com/docs/alert-api",
      "effect": "write",
      "idempotent": false,
      "inputs": [
        {
          "name": "message",
          "type": "string",
          "required": true,
          "pattern": "^[^\\r\\n]{1,130}$"
        },
        {
          "name": "description",
          "type": "string",
          "required": true,
          "pattern": "^[\\s\\S]{1,15000}$"
        },
        {
          "name": "alias",
          "type": "string",
          "required": true,
          "pattern": "^[A-Za-z0-9_.:-]{1,128}$"
        }
      ],
      "steps": [
        {
          "id": "request",
          "request": {
            "method": "POST",
            "url": "{{config.base_url}}/v2/alerts",
            "json": {
              "message": "{{input.message}}",
              "description": "{{input.description}}",
              "alias": "{{input.alias}}",
              "priority": "P3",
              "source": "nano Security Lake"
            }
          },
          "expect": {
            "status": [
              202
            ],
            "path": "requestId",
            "json_type": "string",
            "non_empty": true,
            "fields": {
              "result": "Request will be processed"
            }
          }
        }
      ],
      "outputs": {
        "request_id": "steps.request.requestId"
      },
      "output_types": {
        "request_id": "string"
      },
      "fixtures": [
        "fixtures/create_alert.json"
      ]
    },
    "update_message": {
      "display_name": "Update Message",
      "description": "Submit a replacement for one explicit alert field. Inspect request state separately before claiming completion or attempting another update. API documentation: https://docs.opsgenie.com/docs/alert-api-continued",
      "effect": "write",
      "idempotent": false,
      "inputs": [
        {
          "name": "alert_id",
          "type": "string",
          "required": true,
          "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
        },
        {
          "name": "message",
          "type": "string",
          "required": true,
          "pattern": "^[\\s\\S]{1,130}$"
        }
      ],
      "steps": [
        {
          "id": "request",
          "request": {
            "method": "PUT",
            "url": "{{config.base_url}}/v2/alerts/{{input.alert_id}}/message",
            "query": {
              "identifierType": "id"
            },
            "json": {
              "message": "{{input.message}}"
            }
          },
          "expect": {
            "status": [
              202
            ],
            "path": "requestId",
            "json_type": "string",
            "non_empty": true,
            "fields": {
              "result": "Request will be processed"
            }
          }
        }
      ],
      "outputs": {
        "request_id": "steps.request.requestId"
      },
      "output_types": {
        "request_id": "string"
      },
      "fixtures": [
        "fixtures/update_message.json"
      ]
    },
    "update_description": {
      "display_name": "Update Description",
      "description": "Submit a replacement for one explicit alert field. Inspect request state separately before claiming completion or attempting another update. API documentation: https://docs.opsgenie.com/docs/alert-api-continued",
      "effect": "write",
      "idempotent": false,
      "inputs": [
        {
          "name": "alert_id",
          "type": "string",
          "required": true,
          "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
        },
        {
          "name": "description",
          "type": "string",
          "required": true,
          "pattern": "^[\\s\\S]{1,15000}$"
        }
      ],
      "steps": [
        {
          "id": "request",
          "request": {
            "method": "PUT",
            "url": "{{config.base_url}}/v2/alerts/{{input.alert_id}}/description",
            "query": {
              "identifierType": "id"
            },
            "json": {
              "description": "{{input.description}}"
            }
          },
          "expect": {
            "status": [
              202
            ],
            "path": "requestId",
            "json_type": "string",
            "non_empty": true,
            "fields": {
              "result": "Request will be processed"
            }
          }
        }
      ],
      "outputs": {
        "request_id": "steps.request.requestId"
      },
      "output_types": {
        "request_id": "string"
      },
      "fixtures": [
        "fixtures/update_description.json"
      ]
    }
  }
}
