{
  "version": 1,
  "kind": "action_pack",
  "name": "salesforce",
  "display_name": "Salesforce",
  "description": "Salesforce bounded native response actions. Mutations require explicit approval; receipts do not establish asynchronous completion.",
  "vendor": "Salesforce",
  "categories": [
    "cloud_security"
  ],
  "source": {
    "kind": "nano_authored"
  },
  "config": [
    {
      "name": "base_url",
      "label": "Salesforce My Domain HTTPS origin",
      "required": true
    }
  ],
  "allow": [
    {
      "host": "{{config.base_url}}",
      "path_prefixes": [
        "/services/data/v68.0/query",
        "/services/data/v68.0/sobjects/UserLogin"
      ],
      "host_suffixes": [
        ".my.salesforce.com"
      ]
    }
  ],
  "auth": {
    "type": "bearer",
    "credential": "ACCESS_TOKEN"
  },
  "credentials": [
    {
      "name": "ACCESS_TOKEN",
      "label": "Salesforce OAuth access token with API and Manage Users permission"
    }
  ],
  "defaults": {
    "per_minute": 10,
    "per_day": 500,
    "timeout_secs": 30
  },
  "actions": {
    "get_user_login": {
      "display_name": "Find user login",
      "description": "Find at most one UserLogin record by a pattern-restricted User ID. Read Id, UserId and IsFrozen. Freeze/unfreeze requires the returned UserLogin Id, not UserId. Empty records is a valid no-match result. No free SOQL or nextRecordsUrl is accepted. Official endpoint reference: https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/dome_query.htm",
      "effect": "read",
      "idempotent": true,
      "inputs": [
        {
          "name": "user_id",
          "type": "string",
          "required": true,
          "pattern": "^005[A-Za-z0-9]{12}([A-Za-z0-9]{3})?$"
        }
      ],
      "steps": [
        {
          "id": "request",
          "request": {
            "method": "GET",
            "url": "{{config.base_url}}/services/data/v68.0/query",
            "query": {
              "q": "SELECT Id, UserId, IsFrozen FROM UserLogin WHERE UserId = '{{input.user_id}}' LIMIT 1"
            }
          },
          "expect": {
            "status": [
              200
            ],
            "path": "records",
            "json_type": "array"
          }
        }
      ],
      "outputs": {
        "records": "steps.request.records",
        "result": "steps.request"
      },
      "output_types": {
        "records": "array",
        "result": "object"
      },
      "fixtures": [
        "fixtures/get_user_login.json"
      ]
    },
    "freeze_user": {
      "display_name": "Freeze User",
      "description": "Read and bind the UserLogin identity first, capture prior IsFrozen, and refuse an already-requested state before PATCH. Restore only through the separately approved restore_user_login_state action with this result's user_login_id and prior_is_frozen wired as inputs; an opposite constant is not rollback. Update one UserLogin IsFrozen boolean. Requires Manage Users and API access. This changes login eligibility; it does not delete the user, reclaim a license or promise existing-session revocation. Re-read via get_user_login to verify. Official endpoint reference: https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/dome_update_fields.htm",
      "effect": "destructive",
      "idempotent": false,
      "inputs": [
        {
          "name": "user_login_id",
          "type": "string",
          "required": true,
          "pattern": "^[A-Za-z0-9]{15}([A-Za-z0-9]{3})?$"
        }
      ],
      "steps": [
        {
          "id": "current",
          "request": {
            "method": "GET",
            "url": "{{config.base_url}}/services/data/v68.0/sobjects/UserLogin/{{input.user_login_id}}"
          },
          "expect": {
            "status": [
              200
            ],
            "path": "IsFrozen",
            "json_type": "boolean",
            "input_equals": {
              "Id": "user_login_id"
            },
            "fields": {
              "IsFrozen": false
            }
          }
        },
        {
          "id": "request",
          "request": {
            "method": "PATCH",
            "url": "{{config.base_url}}/services/data/v68.0/sobjects/UserLogin/{{steps.current.Id}}",
            "json": {
              "IsFrozen": true
            },
            "response_format": "text"
          },
          "expect": {
            "status": [
              204
            ]
          }
        }
      ],
      "outputs": {
        "user_login_id": "steps.current.Id",
        "prior_is_frozen": "steps.current.IsFrozen"
      },
      "output_types": {
        "user_login_id": "string",
        "prior_is_frozen": "boolean"
      },
      "rollback": "restore_user_login_state",
      "fixtures": [
        "fixtures/freeze_user.json"
      ]
    },
    "unfreeze_user": {
      "display_name": "Unfreeze User",
      "description": "Read and bind the UserLogin identity first, capture prior IsFrozen, and refuse an already-requested state before PATCH. Restore only through the separately approved restore_user_login_state action with this result's user_login_id and prior_is_frozen wired as inputs; an opposite constant is not rollback. Update one UserLogin IsFrozen boolean. Requires Manage Users and API access. This changes login eligibility; it does not delete the user, reclaim a license or promise existing-session revocation. Re-read via get_user_login to verify. Official endpoint reference: https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/dome_update_fields.htm",
      "effect": "destructive",
      "idempotent": false,
      "inputs": [
        {
          "name": "user_login_id",
          "type": "string",
          "required": true,
          "pattern": "^[A-Za-z0-9]{15}([A-Za-z0-9]{3})?$"
        }
      ],
      "steps": [
        {
          "id": "current",
          "request": {
            "method": "GET",
            "url": "{{config.base_url}}/services/data/v68.0/sobjects/UserLogin/{{input.user_login_id}}"
          },
          "expect": {
            "status": [
              200
            ],
            "path": "IsFrozen",
            "json_type": "boolean",
            "input_equals": {
              "Id": "user_login_id"
            },
            "fields": {
              "IsFrozen": true
            }
          }
        },
        {
          "id": "request",
          "request": {
            "method": "PATCH",
            "url": "{{config.base_url}}/services/data/v68.0/sobjects/UserLogin/{{steps.current.Id}}",
            "json": {
              "IsFrozen": false
            },
            "response_format": "text"
          },
          "expect": {
            "status": [
              204
            ]
          }
        }
      ],
      "outputs": {
        "user_login_id": "steps.current.Id",
        "prior_is_frozen": "steps.current.IsFrozen"
      },
      "output_types": {
        "user_login_id": "string",
        "prior_is_frozen": "boolean"
      },
      "rollback": "restore_user_login_state",
      "fixtures": [
        "fixtures/unfreeze_user.json"
      ]
    },
    "restore_user_login_state": {
      "display_name": "Restore captured UserLogin state",
      "description": "Restore exactly the captured prior_is_frozen boolean for the original user_login_id from freeze_user/unfreeze_user outputs. Both inputs must be wired from the same original result and connection; do not guess a value or substitute another login. Re-read and bind the current UserLogin identity in this connection before PATCH. Requires a fresh destructive-action approval. This is explicit state restoration, not automatic rollback or session restoration. Official endpoint reference: https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/dome_update_fields.htm",
      "effect": "destructive",
      "idempotent": false,
      "inputs": [
        {
          "name": "user_login_id",
          "type": "string",
          "required": true,
          "pattern": "^[A-Za-z0-9]{15}([A-Za-z0-9]{3})?$"
        },
        {
          "name": "prior_is_frozen",
          "type": "bool",
          "required": true
        }
      ],
      "steps": [
        {
          "id": "current",
          "request": {
            "method": "GET",
            "url": "{{config.base_url}}/services/data/v68.0/sobjects/UserLogin/{{input.user_login_id}}"
          },
          "expect": {
            "status": [
              200
            ],
            "path": "IsFrozen",
            "json_type": "boolean",
            "input_equals": {
              "Id": "user_login_id"
            }
          }
        },
        {
          "id": "request",
          "request": {
            "method": "PATCH",
            "url": "{{config.base_url}}/services/data/v68.0/sobjects/UserLogin/{{steps.current.Id}}",
            "json": {
              "IsFrozen": "{{input.prior_is_frozen}}"
            },
            "response_format": "text"
          },
          "expect": {
            "status": [
              204
            ]
          }
        }
      ],
      "outputs": {
        "user_login_id": "steps.current.Id",
        "prior_is_frozen": "steps.current.IsFrozen"
      },
      "output_types": {
        "user_login_id": "string",
        "prior_is_frozen": "boolean"
      },
      "fixtures": [
        "fixtures/restore_prior_frozen.json",
        "fixtures/restore_prior_unfrozen.json"
      ],
      "rollback_unavailable": true,
      "rollback_unavailable_reason": "This action restores an explicitly captured prior state. Further changes require another separately approved action with its own captured state; there is no unconditional opposite rollback."
    }
  }
}
