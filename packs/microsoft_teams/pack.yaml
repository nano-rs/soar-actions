{
  "version": 1,
  "kind": "action_pack",
  "name": "microsoft_teams",
  "display_name": "Microsoft Teams channel notifications",
  "description": "Microsoft Teams channel notifications. Notifications require approval. Uncertain mutations are never automatically resent.",
  "vendor": "Microsoft",
  "categories": [
    "notifications"
  ],
  "source": {
    "kind": "nano_authored"
  },
  "config": [],
  "allow": [
    {
      "host": "graph.microsoft.com",
      "path_prefixes": [
        "/v1.0/teams"
      ]
    }
  ],
  "auth": {
    "type": "bearer",
    "credential": "ACCESS_TOKEN"
  },
  "credentials": [
    {
      "name": "ACCESS_TOKEN",
      "label": "Delegated work/school Graph token with ChannelMessage.Send"
    }
  ],
  "defaults": {
    "per_minute": 10,
    "per_day": 500,
    "timeout_secs": 20
  },
  "actions": {
    "post_message": {
      "display_name": "Post a plain-text Teams channel message",
      "description": "Post with a delegated work/school token carrying ChannelMessage.Send. Application-only migration tokens are unsupported. API reference: https://learn.microsoft.com/en-us/graph/api/channel-post-messages?view=graph-rest-1.0",
      "effect": "destructive",
      "idempotent": false,
      "inputs": [
        {
          "name": "team_id",
          "type": "string",
          "required": true,
          "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        },
        {
          "name": "channel_id",
          "type": "string",
          "required": true,
          "pattern": "^19:[A-Za-z0-9_-]{1,200}@thread\\.(tacv2|skype)$"
        },
        {
          "name": "text",
          "type": "string",
          "required": true,
          "pattern": "^[\\s\\S]{1,8192}$"
        }
      ],
      "steps": [
        {
          "id": "request",
          "request": {
            "method": "POST",
            "url": "https://graph.microsoft.com/v1.0/teams/{{input.team_id}}/channels/{{input.channel_id}}/messages",
            "json": {
              "body": {
                "contentType": "text",
                "content": "{{input.text}}"
              }
            }
          },
          "expect": {
            "status": [
              201
            ],
            "path": "id",
            "non_empty": true
          }
        }
      ],
      "outputs": {
        "message_id": "steps.request.id"
      },
      "fixtures": [
        "fixtures/post_message.json"
      ],
      "rollback_unavailable": true,
      "rollback_unavailable_reason": "A delivered notification, page or external workflow cannot be recalled. No automatic inverse is supplied."
    }
  }
}
