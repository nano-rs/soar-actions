name: Notification payload conformance
on:
  pull_request:
    paths:
      - 'packs/**'
      - 'scripts/check-notification-contract.mjs'
      - '.github/workflows/notification-conformance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-notification-contract.mjs
