name: Batch D part 2 public contract
on: [pull_request, push]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-batch-d.mjs review/batch-d-part2.json
